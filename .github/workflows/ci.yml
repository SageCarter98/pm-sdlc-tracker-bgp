name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only synthetic credentials -- not used anywhere outside this job.
      BGP_DATABASE_URL: postgresql+psycopg2://bgp_app:ci-app-password@localhost:5432/bgp_dev
      BGP_MIGRATION_DATABASE_URL: postgresql+psycopg2://bgp_owner:ci-owner-password@localhost:5432/bgp_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint and format check (ruff)
        # Closes SDLC G3.06's "formatting, linting" leg -- config lives in
        # backend/pyproject.toml (line-length=120, matched to this codebase's
        # existing comment/call-site style; default pyflakes+pycodestyle
        # rules only, no import-sorting or other reordering rule sets).
        run: |
          pip install ruff==0.9.6
          ruff check .
          ruff format --check .
      - name: Create bgp_dev roles and database (REQ-007 two-role setup)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE bgp_owner LOGIN PASSWORD 'ci-owner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -c "CREATE ROLE bgp_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE bgp_dev OWNER bgp_owner;"
          psql -h localhost -U postgres -c "GRANT CONNECT ON DATABASE bgp_dev TO bgp_app;"
          psql -h localhost -U postgres -d bgp_dev -c "GRANT USAGE ON SCHEMA public TO bgp_app;"
      - name: Apply migrations (RLS policies -- REQ-007/008)
        run: alembic upgrade head
      - name: Run tests, including the adversarial cross-tenant suite (REQ-009)
        run: pytest -q
      - name: Performance budget check (DEC08 -- API p95/p99 latency)
        # DEC08's own words: "enforced in CI as a blocking budget check, not
        # a dashboard someone reads occasionally." Already part of the full
        # suite above (so a breach already fails the build); run again on
        # its own so a budget breach is immediately visible by step name in
        # the Actions UI, not buried as "some test in the suite failed" --
        # same reasoning as Dependency/Secret scan each getting their own
        # named step below despite conceptually being "more checks."
        run: pytest -q tests/test_dec08_performance_budgets.py
      - name: Setup Node (WP12/REQ-043 -- render-timing and page-weight budgets)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install render-timing/page-weight budget harness deps
        working-directory: tools/perf-budgets
        run: npm ci
      - name: Start dev server for render-timing/page-weight budget check
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ui/login > /dev/null && exit 0
            sleep 1
          done
          echo "dev server never became healthy"; cat /tmp/uvicorn.log; exit 1
      - name: Render-timing and page-weight budgets (DEC08 Q14/Q16)
        # REQ-043's second of three numeric sub-parts (see tools/perf-budgets/
        # README.md) -- LCP/INP/CLS and page-weight, measured with a real
        # headless Chrome via Lighthouse against the server started above.
        # Same DEC08 "enforced in CI as a blocking budget check" rationale
        # as the API-latency step above.
        working-directory: tools/perf-budgets
        env:
          BGP_PERF_BASE_URL: http://127.0.0.1:8000
        run: npm run check
      - name: Dependency vulnerability scan (REQ-046)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt
      - name: Secret scan (REQ-046)
        # gitleaks/gitleaks-action@v2 constructs a git-log diff range from
        # the push event's before/after commits; on this repo's very first
        # push that range was <root-commit>^..HEAD, and <root-commit>^
        # doesn't exist (a repository's first commit has no parent) --
        # confirmed 2026-09-17, run 35185489159: "fatal: ambiguous
        # argument... unknown revision". Not a leaked secret, a real CI
        # bug in how that action builds its scan range for a repo's first
        # ever push. Scanning the working tree directly (--no-git) sidesteps
        # the whole class of git-history-range edge cases; the tradeoff is
        # this only catches secrets present in the current checkout, not
        # ones committed and later removed -- an acceptable scope for a
        # repository with no prior secret-leak history to audit.
        working-directory: .
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --source . -v
          rm -f gitleaks gitleaks.tar.gz
