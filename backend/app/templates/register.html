{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<h1>Create an account</h1>
<p class="hint">This prototype uses synthetic data only — do not register with a real personal email or password you use elsewhere.</p>
<form method="post" action="/ui/register" novalidate>
  <input type="hidden" name="next" value="{{ next or '' }}">
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" autocomplete="email" required value="{{ email or '' }}">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
  </div>
  <div class="field">
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
  </div>
  <button type="submit">Create account</button>
</form>
<p><a href="/ui/login{{ ('?next=' + next) if next else '' }}">Already have an account? Log in</a></p>
{% endblock %}
