name: integrity-verify

# DEC05 G4 (docs/blueprint/BGP_DEC_Resolution_Intake_2026-09-25_ANSWERED.md,
# Candidate A+): "at least daily" independent verification cadence. Separate
# from ci.yml's own Postgres service -- this is the first time bgp_backup
# runs anywhere but a developer's own machine (scripts/restore_drill.py has
# only ever run manually against local dev Postgres until now), a real gap
# this workflow closes as a side effect of giving it somewhere to run at
# all.
#
# This only verifies whatever Postgres this CI workflow's own service
# container holds -- not a production deployment, which doesn't exist yet.
# See scripts/verify_against_anchor.py's own docstring for the honest limit
# on what happens if this ever finds a real mismatch (bgp_backup has no
# INSERT grant on integrity_incidents).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only synthetic credentials -- not used anywhere outside this job.
      BGP_DATABASE_URL: postgresql+psycopg2://bgp_app:ci-app-password@localhost:5432/bgp_dev
      BGP_MIGRATION_DATABASE_URL: postgresql+psycopg2://bgp_owner:ci-owner-password@localhost:5432/bgp_dev
      BGP_BACKUP_DATABASE_URL: postgresql+psycopg2://bgp_backup:ci-backup-password@localhost:5432/bgp_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Create bgp_dev roles and database (REQ-007 two-role setup + bgp_backup)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE bgp_owner LOGIN PASSWORD 'ci-owner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -c "CREATE ROLE bgp_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE ROLE bgp_backup LOGIN PASSWORD 'ci-backup-password' NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS IN ROLE pg_read_all_data;"
          psql -h localhost -U postgres -c "CREATE DATABASE bgp_dev OWNER bgp_owner;"
          psql -h localhost -U postgres -c "GRANT CONNECT ON DATABASE bgp_dev TO bgp_app;"
          psql -h localhost -U postgres -c "GRANT CONNECT ON DATABASE bgp_dev TO bgp_backup;"
          psql -h localhost -U postgres -d bgp_dev -c "GRANT USAGE ON SCHEMA public TO bgp_app;"
          psql -h localhost -U postgres -d bgp_dev -c "GRANT USAGE ON SCHEMA public TO bgp_backup;"
      - name: Apply migrations (RLS policies -- REQ-007/008, DEC05 worm_anchor_receipts)
        run: alembic upgrade head
      - name: Anchor any unanchored checkpoints (DEC05 G2)
        run: python scripts/anchor_worm.py
      - name: Independent verification (DEC05 G3 -- same-instance re-derivation + external-anchor cross-check)
        run: python scripts/verify_against_anchor.py
