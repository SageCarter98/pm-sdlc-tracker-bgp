name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only synthetic credentials -- not used anywhere outside this job.
      BGP_DATABASE_URL: postgresql+psycopg2://bgp_app:ci-app-password@localhost:5432/bgp_dev
      BGP_MIGRATION_DATABASE_URL: postgresql+psycopg2://bgp_owner:ci-owner-password@localhost:5432/bgp_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Create bgp_dev roles and database (REQ-007 two-role setup)
        env:
          PGPASSWORD: ci-superuser-password
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE bgp_owner LOGIN PASSWORD 'ci-owner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h localhost -U postgres -c "CREATE ROLE bgp_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE bgp_dev OWNER bgp_owner;"
          psql -h localhost -U postgres -c "GRANT CONNECT ON DATABASE bgp_dev TO bgp_app;"
          psql -h localhost -U postgres -d bgp_dev -c "GRANT USAGE ON SCHEMA public TO bgp_app;"
      - name: Apply migrations (RLS policies -- REQ-007/008)
        run: alembic upgrade head
      - name: Run tests, including the adversarial cross-tenant suite (REQ-009)
        run: pytest -q
      - name: Dependency vulnerability scan (REQ-046)
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt
      - name: Secret scan (REQ-046)
        # gitleaks/gitleaks-action@v2 constructs a git-log diff range from
        # the push event's before/after commits; on this repo's very first
        # push that range was <root-commit>^..HEAD, and <root-commit>^
        # doesn't exist (a repository's first commit has no parent) --
        # confirmed 2026-09-17, run 35185489159: "fatal: ambiguous
        # argument... unknown revision". Not a leaked secret, a real CI
        # bug in how that action builds its scan range for a repo's first
        # ever push. Scanning the working tree directly (--no-git) sidesteps
        # the whole class of git-history-range edge cases; the tradeoff is
        # this only catches secrets present in the current checkout, not
        # ones committed and later removed -- an acceptable scope for a
        # repository with no prior secret-leak history to audit.
        working-directory: .
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --source . -v
          rm -f gitleaks gitleaks.tar.gz
